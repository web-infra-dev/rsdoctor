name: Deploy example demos

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'packages/client/**'
      - 'packages/core/**'
      - 'packages/sdk/**'
      - 'packages/graph/**'
      - 'packages/types/**'
      - 'packages/utils/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-examples.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: example-demos-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'web-infra-dev/rsdoctor'
    runs-on: ubuntu-latest
    environment: netlify
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        run: |
          npm install -g corepack@latest --force
          corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build reports
        env:
          CI: 'true'
          RSDOCTOR_DEMO: 'true'
        run: |
          pnpm --dir examples/rspack-minimal run build:analysis
          pnpm --dir examples/rsbuild-minimal run build:analysis

      - name: Prepare static site
        run: |
          mkdir -p demo-site/rspack-minimal demo-site/rsbuild-minimal
          cp examples/demo-site/index.html demo-site/index.html
          cp examples/rspack-minimal/dist/rsdoctor-demo.html demo-site/rspack-minimal/index.html
          cp examples/rsbuild-minimal/dist/rsdoctor-demo.html demo-site/rsbuild-minimal/index.html

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_EXAMPLES_SITE_ID }}
        run: pnpm dlx netlify-cli@23.12.2 deploy --dir demo-site --prod --no-build
