name: E2E Testing by Midscene

# AI-native visual E2E against synthetic local fixtures.
# Model credentials are scoped to verification and case execution.

on:
  pull_request:
    paths:
      [
        'packages/**',
        'e2e/**',
        'tests/midscene/**',
        '.github/workflows/midscene.yml',
        'pnpm-lock.yaml',
      ]
  push:
    branches: [main]
    paths:
      [
        'packages/**',
        'e2e/**',
        'tests/midscene/**',
        '.github/workflows/midscene.yml',
        'pnpm-lock.yaml',
      ]
  workflow_dispatch:
    inputs:
      file_concurrency:
        description: Concurrent cases in the regular E2E run
        type: choice
        options: ['1', '5', '15']
        default: '5'
      publish_pages:
        description: Publish reports to GitHub Pages
        required: false
        type: boolean
        default: true

# Model runs use relevant upstream main pushes or manually selected branches.
# Pages publication defaults on; manual runs can disable it.

permissions:
  contents: read

# PR checks are independent; model runs serialize history reads through deployment.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('midscene-e2e-pr-{0}', github.event.pull_request.number) || 'midscene-e2e' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MIDSCENE_UPSTREAM_REPOSITORY: web-infra-dev/rsdoctor

jobs:
  fixture-windows:
    name: Validate fixture cleanup on Windows
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: node --test scripts/fixture-server.test.mjs
        working-directory: tests/midscene

  validate:
    if: github.event_name == 'pull_request'
    name: Validate AI E2E definitions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/midscene/package-lock.json
      - run: npm ci
        working-directory: tests/midscene
      - run: npm run typecheck && npm run test:fixtures
        working-directory: tests/midscene
      - name: Explain pull request coverage
        if: github.event_name == 'pull_request'
        run: |
          echo '## Midscene E2E definitions validated' >> "$GITHUB_STEP_SUMMARY"
          echo 'This PR check does not call a model. AI E2E runs on relevant upstream main pushes or manual dispatch. Fork PR code never receives model credentials.' >> "$GITHUB_STEP_SUMMARY"

  midscene:
    name: Midscene E2E
    outputs:
      report-artifact-name: ${{ steps.midscene-test.outputs.report-artifact-name }}
    environment:
      name: Model
      deployment: false
    if: >-
      (github.event_name != 'pull_request') &&
      (github.repository == 'web-infra-dev/rsdoctor' && github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.repository != 'web-infra-dev/rsdoctor'))
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      HEADLESS: 'true'
      MIDSCENE_FILE_CONCURRENCY: ${{ inputs.file_concurrency || '5' }}
      # Allow the endpoint's minute-based quota to recover; case retries stay off.
      MIDSCENE_MODEL_RETRY_COUNT: '4'
      MIDSCENE_MODEL_RETRY_INTERVAL: '65000'
      # The model endpoint is reachable over IPv4; avoid family-race timeouts.
      NODE_OPTIONS: '--dns-result-order=ipv4first --no-network-family-autoselection'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # pnpm must exist before setup-node resolves the pnpm store for its
      # cache; without a version it reads the root `packageManager` field.
      - name: Enable pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Activate Node.js 24 and pnpm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install workspace dependencies and build checked-out packages
        run: pnpm install --frozen-lockfile

      - name: Install Midscene test dependencies
        # allowScripts for esbuild/sharp is declared in this package.json, so
        # npm install runs their (approved) install scripts non-interactively.
        working-directory: tests/midscene
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate fixture support before model access
        working-directory: tests/midscene
        run: npm run typecheck && npm run test:fixtures

      - name: Verify Midscene model compatibility
        working-directory: tests/midscene
        # Only model verification and case execution receive model credentials.
        env:
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ vars.MIDSCENE_MODEL_NAME || secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_BASE_URL: ${{ vars.MIDSCENE_MODEL_BASE_URL || secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_FAMILY: ${{ vars.MIDSCENE_MODEL_FAMILY || secrets.MIDSCENE_MODEL_FAMILY }}
        run: npm run check:model

      - name: Run all Midscene cases
        id: midscene-test
        uses: web-infra-dev/midscene-action@5ef922b20a69d69a0f34639c4c867ba2049f6ede # v1
        env:
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ vars.MIDSCENE_MODEL_NAME || secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_BASE_URL: ${{ vars.MIDSCENE_MODEL_BASE_URL || secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_FAMILY: ${{ vars.MIDSCENE_MODEL_FAMILY || secrets.MIDSCENE_MODEL_FAMILY }}
          MIDSCENE_REPLANNING_CYCLE_LIMIT: '40'
          MIDSCENE_RETRY: '0'
        with:
          working-directory: tests/midscene
          command: timeout --signal=TERM --kill-after=10s 220m npx midscene-test
          artifact-name: midscene-results
          retention-days: '14'
          # Keep the existing GitHub Pages site and per-case screenshot table.
          publish-pages: false

  publish-pages:
    name: Publish Midscene Pages report
    needs: midscene
    if: >-
      always() && !cancelled() &&
      vars.MIDSCENE_PUBLISH_REPO == github.repository &&
      (github.event_name != 'workflow_dispatch' || inputs.publish_pages) &&
      needs.midscene.outputs.report-artifact-name != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.report.outputs.page-url }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      # Shared Pages support is proposed upstream; pin the reviewed fork commit.
      - id: report
        uses: quanru/midscene-action-upstream/pages@b0b2fe13eac26c75327a4cf322865fcd98c9c0f4
        with:
          artifact-name: ${{ needs.midscene.outputs.report-artifact-name }}
          producer-result: ${{ needs.midscene.result }}
          history-branches: main,test/midscene-e2e,ci/midscene-action,benchmark/midscene-speed-20261022
