name: Runtime compatibility

on:
  pull_request:
    branches: [main, release_*, release-*]
  push:
    branches: [main, release_*, release-*]
    paths-ignore:
      - 'packages/document/**'
      - '**/*.md'
      - '**/*.mdx'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.19.0', '22.12.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up build runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.15.0'
      - name: Install pnpm
        run: |
          npm install -g corepack@latest --force
          corepack enable
      - name: Build and pack
        run: |
          pnpm install --frozen-lockfile
          node scripts/runtime-compatibility/prepare.mjs "$RUNNER_TEMP/rsdoctor-consumer"
      - name: Set up consumer runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install packed packages and test
        working-directory: ${{ runner.temp }}/rsdoctor-consumer
        env:
          EXPECTED_NODE_VERSION: ${{ matrix.node-version }}
        run: |
          npm install --engine-strict --ignore-scripts --no-audit --no-fund
          node --test --test-timeout=120000 smoke.test.mjs
