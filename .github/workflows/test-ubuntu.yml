name: Test (Ubuntu, Node 20 runtime)

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events for main and release branches
  pull_request:
    branches: [main, release_*, release-*]

  push:
    branches: [main, release_*, release-*]
    paths-ignore:
      - 'packages/document/**'
      - '**/*.md'
      - '**/*.mdx'

  merge_group:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  runtime:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up build runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.18.0'
      - name: Install pnpm
        run: |
          npm install -g corepack@latest --force
          corepack enable
      - name: Build and pack
        run: |
          pnpm install --frozen-lockfile
          node scripts/runtime-compatibility/prepare.mjs "$RUNNER_TEMP/rsdoctor-consumer"
      - name: Set up consumer runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20.19.0'
      - name: Install packed packages and test
        working-directory: ${{ runner.temp }}/rsdoctor-consumer
        env:
          EXPECTED_NODE_VERSION: '20.19.0'
        run: |
          npm install --engine-strict --ignore-scripts --no-audit --no-fund
          npm test
