name: Test (Ubuntu)

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events for main and release branches
  pull_request:
    branches: [main, release_*, release-*]

  push:
    branches: [main, release_*, release-*]
    paths-ignore:
      - 'packages/document/**'
      - '**/*.md'
      - '**/*.mdx'

  merge_group:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

    # A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # ======== ut ========
  ut-ubuntu:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [22.x]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 10

      - name: Install Pnpm
        run: |
          npm install -g corepack@latest --force
          corepack enable

      - name: Check skip CI
        run: echo "RESULT=$(node ./scripts/skipCI.js)" >> "$GITHUB_OUTPUT"
        id: skip-ci

      - name: Log skip CI result
        run: echo "${{steps.skip-ci.outputs.RESULT}}"

      - name: Setup Node.js ${{ matrix.node-version }}
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: pnpm install

      - name: Unit Test
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: pnpm run test:all

  runtime:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.19.0', '22.12.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up build runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.15.0'
      - name: Install pnpm
        run: |
          npm install -g corepack@latest --force
          corepack enable
      - name: Build and pack
        run: |
          pnpm install --frozen-lockfile
          node scripts/runtime-compatibility/prepare.mjs "$RUNNER_TEMP/rsdoctor-consumer"
      - name: Set up consumer runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install packed packages and test
        working-directory: ${{ runner.temp }}/rsdoctor-consumer
        env:
          EXPECTED_NODE_VERSION: ${{ matrix.node-version }}
        run: |
          npm install --engine-strict --ignore-scripts --no-audit --no-fund
          node --test --test-timeout=120000 smoke.test.mjs

