name: Test (Ubuntu, Node 20 runtime)

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events for main and release branches
  pull_request:
    branches: [main, release_*, release-*]

  push:
    branches: [main, release_*, release-*]

  merge_group:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  runtime:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Detect changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        # Manual runs leave the output unset; only 'false' skips later steps.
        if: github.event_name != 'workflow_dispatch'
        with:
          token: ''
          # Compare release-branch pushes with their previous commit, not main.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          predicate-quantifier: 'some-with-excludes'
          filters: .github/filters.yml

      - name: Set up build runtime
        if: steps.changes.outputs.changed != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.18.0'

      - name: Install pnpm
        if: steps.changes.outputs.changed != 'false'
        run: |
          npm install -g corepack@latest --force
          corepack enable

      - name: Build and pack
        if: steps.changes.outputs.changed != 'false'
        run: |
          pnpm install
          node scripts/runtime-compatibility/prepare.mjs "$RUNNER_TEMP/rsdoctor-consumer"

      - name: Set up consumer runtime
        if: steps.changes.outputs.changed != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20.19.0'

      - name: Install packed packages and test
        if: steps.changes.outputs.changed != 'false'
        working-directory: ${{ runner.temp }}/rsdoctor-consumer
        env:
          EXPECTED_NODE_VERSION: '20.19.0'
        run: |
          npm install --engine-strict --ignore-scripts --no-audit --no-fund
          npm test
