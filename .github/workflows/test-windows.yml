name: Test (Windows)

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events for main and release branches
  pull_request:
    branches: [main, release_*, release-*]

  push:
    branches: [main, release_*, release-*]

  merge_group:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # ======== ut ========
  ut-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [22.x]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Git config
        shell: bash
        run: |
          git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Detect changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        # Manual runs leave the output unset; only 'false' skips later steps.
        if: github.event_name != 'workflow_dispatch'
        with:
          token: ''
          # Compare release-branch pushes with their previous commit, not main.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          predicate-quantifier: 'some-with-excludes'
          filters: .github/filters.yml

      - name: Install Pnpm
        if: steps.changes.outputs.changed != 'false'
        run: |
          npm install -g corepack@latest --force
          corepack enable

      - name: Setup Node.js ${{ matrix.node-version }}
        if: steps.changes.outputs.changed != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        if: steps.changes.outputs.changed != 'false'
        run: pnpm install

      - name: Unit Test
        if: steps.changes.outputs.changed != 'false'
        run: pnpm run test
