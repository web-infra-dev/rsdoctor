packages:
  - e2e/**
  - scripts/**
  - packages/**
  - examples/**
  - '!**/compiled/**'

allowBuilds:
  '@swc/core': false
  core-js: false
  core-js-pure: false
  esbuild: true

catalog:
  '@rsbuild/core': ^2.1.13
  '@rsbuild/plugin-check-syntax': ^1.6.1
  '@rsbuild/plugin-less': ^1.6.4
  '@rsbuild/plugin-node-polyfill': ^1.4.6
  '@rsbuild/plugin-react': ^2.1.0
  '@rsbuild/plugin-sass': ^1.5.3
  '@rsbuild/plugin-svgr': ^2.0.5
  '@rsbuild/plugin-type-check': ^1.6.0
  '@rspack/cli': ^2.0.8
  '@rspack/core': ^2.1.10
  '@rspack/lite-tapable': ^1.1.5
  '@rspack/plugin-react-refresh': ^2.0.2
  '@rspack/resolver': ^0.2.8
  '@rstest/playwright': 0.11.11
  '@types/connect': 3.4.38
  '@types/estree': 1.0.5
  '@types/fs-extra': ^11.0.4
  '@types/node': ^24.12.3
  '@types/path-browserify': 1.0.3
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.5
  '@typescript/native-preview': 7.0.0-dev.20260707.2
  antd: 5.19.1
  clsx: ^2.1.1
  cross-env: ^10.1.0
  connect-next: 4.0.3
  dayjs: 1.11.23
  es-toolkit: ^1.49.0
  filesize: ^11.0.22
  fs-extra: ^11.1.1
  path-browserify: 1.0.1
  react: 19.2.8
  react-dom: 19.2.8
  react-error-boundary: ^6.1.4
  react-markdown: ^10.1.0
  react-router-dom: 6.30.3
  sirv: 3.0.2
  source-map: ^0.7.6
  tslib: 2.8.1
  typescript: ^7.0.2

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@rspack/*'
  - '@rsbuild/*'
  - '@rslib/*'
  - '@rspress/*'
  - '@rstest/*'
  - '@rsdoctor/*'
  - '@rslint/*'
  - '@rstackjs/*'
  - 'rstack'
  - 'rsbuild-plugin-dts'
  - 'heading-case'

overrides:
  '@remix-run/router': 1.23.4
  minimatch: ^10.2.6
  rc-dialog: 9.1.0
  rc-tree: 5.7.2
  tslib: 2.8.1

strictDepBuilds: true
