cases:
  - name: BUNDLE-01 Inspect modules in an output asset
    tags: [shard-1, modules]
    steps:
      - app.open: { path: '/#/bundle/size' }
      - aiAct: In the Output Assets List, open small.js to inspect its modules.
      - aiAssert: The Modules of "small.js" panel shows small-data.js.
      - aiAct: In the Output Assets List, open large.js to inspect its modules.
      - aiAssert: The Modules of "large.js" panel shows large-data.js.
  - name: BUNDLE-02 Filter large assets and restore the smaller asset
    tags: [shard-1, assets]
    steps:
      - app.open: { path: '/#/bundle/size' }
      - aiAct: Set the Asset Size filter to 1 MB.
      - aiAssert: The Output Assets List contains large.js but not small.js, and the Asset Size filter shows 1 MB.
      - aiAct: Change only the Asset Size unit to KB, keeping the value 1.
      - aiAssert: The Output Assets List contains both small.js and large.js, and the Asset Size filter shows 1 KB.
  - name: BUNDLE-03 Filter modules inside a selected asset
    tags: [shard-1, filter]
    steps:
      - app.open: { path: '/#/bundle/size' }
      - aiAct: In the Output Assets List, select small.js, then set the Module Size filter to 1 MB.
      - aiAssert: The Modules of "small.js" panel has no small-data.js entry and the Module Size filter shows 1 MB.
      - aiAct: In the Output Assets List, select large.js.
      - aiAssert: The Modules of "large.js" panel contains large-data.js while the Module Size filter is still 1 MB.
      - aiAct: Change the Module Size unit to KB without changing the value, then select small.js in the Output Assets List.
      - aiAssert: The Modules of "small.js" panel shows small-data.js and the Module Size filter shows 1 KB.
