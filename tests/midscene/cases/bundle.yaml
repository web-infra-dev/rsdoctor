cases:
  - name: BUNDLE-01 Inspect modules in an output asset
    tags: [modules]
    steps:
      - app.open: { path: '/#/bundle/size' }
      - aiAct: In the Output Assets List, open small.js to inspect its modules.
      - aiAssert: The Modules of "small.js" panel shows small-data.js.
      - aiAct: In the Output Assets List, open large.js to inspect its modules.
      - aiAssert: The Modules of "large.js" panel shows large-data.js.
  - name: BUNDLE-02 Filter large assets and restore the smaller asset
    tags: [assets]
    steps:
      - app.open: { path: '/#/bundle/size' }
      - aiAct: First change the Asset Size unit to MB, then enter 1 in its numeric input, in that order.
      - aiAssert: The Output Assets List contains large.js but not small.js, and the Asset Size filter shows 1 MB.
      - aiAct: Change only the Asset Size unit to KB, keeping the value 1.
      - aiAssert: The Output Assets List contains both small.js and large.js, and the Asset Size filter shows 1 KB.
  - name: BUNDLE-03 Filter modules inside a selected asset
    tags: [filter]
    steps:
      - app.open: { path: '/#/bundle/size' }
      - aiAct: In the Output Assets List, select small.js. First change the Module Size unit to MB, then enter 1 in its numeric input, in that order.
      - aiAssert: The Modules of "small.js" panel has no small-data.js entry and the Module Size filter shows 1 MB.
      - aiAct: In the Output Assets List, select large.js.
      - aiAssert: The Modules of "large.js" panel contains large-data.js while the Module Size filter is still 1 MB.
      - aiAct: Change the Module Size unit to KB without changing the value, then select small.js in the Output Assets List.
      - aiAssert: The Modules of "small.js" panel shows small-data.js and the Module Size filter shows 1 KB.
  - name: BUNDLE-04 Apply the asset filter value before changing its unit
    tags: [original-filter-order]
    steps:
      - app.open: { path: '/#/bundle/size' }
      - aiAct: Enter 1 in the Asset Size numeric input. Leave its current unit unchanged.
      - aiAssert: The Asset Size value is 1, its unit is not MB, and small.js is still visible in Output Assets List.
      - aiAct: Change only the Asset Size unit to MB without typing the value again.
      - aiAssert: The Output Assets List contains large.js but not small.js, and the Asset Size filter shows 1 MB.
      - aiAct: Change only the Asset Size unit to KB without typing the value again.
      - aiAssert: The Output Assets List contains both small.js and large.js, and the Asset Size filter shows 1 KB.
  - name: BUNDLE-05 Apply the module filter value before changing its unit
    tags: [original-filter-order]
    steps:
      - app.open: { path: '/#/bundle/size' }
      - aiAct: Select small.js in Output Assets List and enter 1 in the Module Size numeric input. Leave its current unit unchanged.
      - aiAssert: The Module Size value is 1, its unit is not MB, and small-data.js is visible in the selected asset's module panel.
      - aiAct: Change only the Module Size unit to MB without typing the value again.
      - aiAssert: The Modules of "small.js" panel has no small-data.js entry and the Module Size filter shows 1 MB.
      - aiAct: Select large.js in Output Assets List, keeping the Module Size filter unchanged.
      - aiAssert: The Modules of "large.js" panel contains large-data.js while the Module Size filter shows 1 MB.
      - aiAct: Change only the Module Size unit to KB without typing the value again, then select small.js in Output Assets List.
      - aiAssert: The Modules of "small.js" panel shows small-data.js and the Module Size filter shows 1 KB.
