cases:
  - name: REPORT-01 Inspect rule results and an empty rule tab
    tags: [shard-1, report]
    steps:
      - app.open: { path: '/#/overall' }
      - aiAct: Open the Duplicate Packages rule tab in the report.
      - aiAssert: The selected Duplicate Packages rule panel displays No Data.
      - aiAct: Switch to the ECMA Version Check rule tab.
      - aiAssert: The selected rule panel displays ECMA Version Check warnings.
  - name: REPORT-02 Upload and analyze a build manifest
    tags: [shard-1, report]
    steps:
      - app.open: { path: '/#/resources/uploader' }
      - aiAct:
          prompt: Click the JSON upload area and upload rsdoctor-data.json.
          options:
            fileChooserAllowedDir: .fixture/uploads
            fileChooserAccept: .fixture/uploads/rsdoctor-data.json
      - aiAssert: The uploaded report displays Bundle Overall.
      - aiAct: Use report navigation to open Bundle Size.
      - aiAssert: Output Assets List displays small.js and large.js from the uploaded build.
